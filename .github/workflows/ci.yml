name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check
      - name: Clippy
        run: cargo clippy --all -- -D warnings
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace

  formal-superposition-checker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install pinned Verus toolchain
        env:
          VERUS_INSTALL_DIR: ${{ runner.temp }}/mrs-verus
          RUSTUP_HOME: ${{ runner.temp }}/mrs-verus-rustup
        run: formal/superposition-checker/install-verus.sh
      - name: Verify superposition checker specifications and executable refinements
        env:
          VERUS: ${{ runner.temp }}/mrs-verus/0.2026.10.04.426d8b0/verus
          RUSTUP_HOME: ${{ runner.temp }}/mrs-verus-rustup
        run: formal/superposition-checker/verify.sh
