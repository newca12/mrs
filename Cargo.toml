[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/newca12/mrs"
rust-version = "1.97.0"

[workspace.dependencies]
mrs-core = { path = "crates/mrs-core", version = "0.2.1" }
mrs-szs = { path = "crates/mrs-szs", version = "0.2.1" }
mrs-tptp = { path = "crates/mrs-tptp", version = "0.2.1" }
mrs-unify = { path = "crates/mrs-unify", version = "0.2.1" }
mrs-cnf = { path = "crates/mrs-cnf", version = "0.2.1" }
mrs-calculus = { path = "crates/mrs-calculus", version = "0.2.1" }
mrs-index = { path = "crates/mrs-index", version = "0.2.1" }
mrs-proof = { path = "crates/mrs-proof", version = "0.2.1" }
mrs-search = { path = "crates/mrs-search", version = "0.2.1" }
winnow = { version = "1.0.3", features = ["simd"] }
cadical = "0.1.16"
rustc-hash = "2.1"
wincode = { version = "0.5.5", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1

[package]
name = "mrs"
version = "0.2.1"
edition.workspace = true
description = "Automated theorem prover for TPTP problems using superposition calculus"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["theorem-prover", "tptp", "superposition", "casc", "logic"]
categories = ["science", "command-line-utilities"]
exclude = ["evil-proofs/", "benchmarks/", "docs/", "problems/", "models/", "ProoVer_Kimi.md"]

[dependencies]
mrs-core = { workspace = true }
mrs-szs = { workspace = true }
mrs-tptp = { workspace = true }
mrs-unify = { workspace = true }
mrs-cnf = { workspace = true }
mrs-calculus = { workspace = true }
mrs-search = { workspace = true }
mrs-proof = { workspace = true }
cadical.workspace = true
wincode = { workspace = true, optional = true }
num_cpus = "1.17.0"
mimalloc = { version = "0.1", default-features = false }
burn = { version = "0.21.0", optional = true, default-features = false }

[features]
default = []
# Enables ProoVer-friendly behaviours on the `mrs` binary:
# - read TPTP problem from stdin when the path is `-`
# - `--quiet` suppresses informational stderr/stdout chatter
# - `--fast` selects a short-budget single-strategy schedule tuned for
#   the small ATP queries emitted by `mrs-proover`.
# All three are no-ops in the default build.
proover = []
ml = ["mrs-core/ml", "mrs-search/ml-guidance", "dep:burn", "burn/ndarray", "dep:wincode"]
ml-guidance = ["mrs-core/ml", "mrs-search/ml-guidance", "dep:burn", "burn/ndarray", "dep:wincode"]
