[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/newca12/mrs"
rust-version = "1.95"

[workspace.dependencies]
mrs-core = { path = "crates/mrs-core", version = "0.1.9" }
mrs-szs = { path = "crates/mrs-szs", version = "0.1.9" }
mrs-tptp = { path = "crates/mrs-tptp", version = "0.1.9" }
mrs-unify = { path = "crates/mrs-unify", version = "0.1.9" }
mrs-cnf = { path = "crates/mrs-cnf", version = "0.1.9" }
mrs-calculus = { path = "crates/mrs-calculus", version = "0.1.9" }
mrs-index = { path = "crates/mrs-index", version = "0.1.9" }
mrs-proof = { path = "crates/mrs-proof", version = "0.1.9" }
mrs-search = { path = "crates/mrs-search", version = "0.1.9" }
winnow = "1.0.3"
cadical = "0.1.16"

[package]
name = "mrs"
version = "0.1.9"
edition.workspace = true
description = "Automated theorem prover for TPTP problems using superposition calculus"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["theorem-prover", "tptp", "superposition", "casc", "logic"]
categories = ["science", "command-line-utilities"]
exclude = ["evil-proofs/", "benchmarks/", "docs/", "problems/", "ProoVer_Kimi.md"]

[dependencies]
mrs-core = { workspace = true }
mrs-szs = { workspace = true }
mrs-tptp = { workspace = true }
mrs-unify = { workspace = true }
mrs-cnf = { workspace = true }
mrs-calculus = { workspace = true }
mrs-search = { workspace = true }
cadical.workspace = true

[features]
default = []
# Enables ProoVer-friendly behaviours on the `mrs` binary:
# - read TPTP problem from stdin when the path is `-`
# - `--quiet` suppresses informational stderr/stdout chatter
# - `--fast` selects a short-budget single-strategy schedule tuned for
#   the small ATP queries emitted by `mrs-proover`.
# All three are no-ops in the default build.
proover = []
