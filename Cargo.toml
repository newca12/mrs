[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/newca12/mrs"
rust-version = "1.99.1"

[workspace.dependencies]
mrs-core = { path = "crates/mrs-core" }
mrs-szs = { path = "crates/mrs-szs" }
mrs-tptp = { path = "crates/mrs-tptp" }
mrs-unify = { path = "crates/mrs-unify" }
mrs-cnf = { path = "crates/mrs-cnf" }
mrs-calculus = { path = "crates/mrs-calculus" }
mrs-index = { path = "crates/mrs-index" }
mrs-proof = { path = "crates/mrs-proof" }
mrs-search = { path = "crates/mrs-search" }
mrs-proover = { path = "crates/mrs-proover" }
mrs-prephase = { path = "crates/mrs-prephase" }
mrs-proof-kernel = { path = "crates/mrs-proof-kernel" }
mrs-cadical = { path = "crates/mrs-cadical" }
mrs-cadical-sys = { path = "crates/mrs-cadical-sys" }
mrs = { path = "." }
burn = { version = "0.22.0", default-features = false }
winnow = { version = "1.0.4", features = ["simd"] }
rustc-hash = "2.1.3"
sha2 = "0.11.0"
smallvec = "1.16.3"
wincode = { version = "0.6.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
cc = { version = "1.7.0", features = ["parallel"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
libc = "0.2.191"
mimalloc = { version = "0.1.52", default-features = false }
num_cpus = "1.17.0"
pretty_assertions = "1.4.1"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
shlex = "2.0.1"
sysinfo = "0.39.6"
tempfile = "3.27.0"
wait-timeout = "0.2.1"
walkdir = "2.5.0"

[profile.dev]
debug = 0
strip = true

[profile.release]
lto = "fat"
codegen-units = 1
debug = 0
strip = true

[package]
name = "mrs"
version.workspace = true
edition.workspace = true
description = "Automated theorem prover for TPTP problems using superposition calculus"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["theorem-prover", "tptp", "superposition", "casc", "logic"]
categories = ["science", "command-line-utilities"]
exclude = ["evil-proofs/", "benchmarks/", "docs/", "problems/", "models/", "ProoVer_Kimi.md"]

[dependencies]
mrs-core = { workspace = true }
rustc-hash = { workspace = true }
mrs-szs = { workspace = true }
mrs-tptp = { workspace = true }
mrs-unify = { workspace = true }
mrs-cnf = { workspace = true }
mrs-calculus = { workspace = true }
mrs-search = { workspace = true }
mrs-proof = { workspace = true }
mrs-proover = { workspace = true }
mrs-proof-kernel = { workspace = true }
mrs-cadical = { workspace = true }
mrs-prephase = { workspace = true }
wincode = { workspace = true, optional = true }
num_cpus = { workspace = true }
tikv-jemallocator = "0.7"
burn = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Enables ProoVer-friendly behaviours on the `mrs` binary:
# - read TPTP problem from stdin when the path is `-`
# - `--quiet` suppresses informational stderr/stdout chatter
# - `--fast` selects a short-budget single-strategy schedule tuned for
#   the small ATP queries emitted by `mrs-proover`.
# All three are no-ops in the default build.
proover = []
ml = ["mrs-core/ml", "mrs-search/ml-guidance", "dep:burn", "burn/flex", "dep:wincode"]
ml-guidance = ["mrs-core/ml", "mrs-search/ml-guidance", "dep:burn", "burn/flex", "dep:wincode"]
parent-guidance = ["mrs-search/parent-guidance"]
