[package]
name = "mrs-bench"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CASC benchmark harness and report tool for mrs"

[dependencies]
mrs-core = { workspace = true }
mrs-tptp = { workspace = true }
walkdir = "2.5.0"

[[bin]]
name = "bench_report"
path = "src/main.rs"

[[bin]]
name = "categorize_tptp"
path = "src/bin/categorize_tptp.rs"

[[bin]]
name = "greedy_set_cover"
path = "src/bin/greedy_set_cover.rs"
