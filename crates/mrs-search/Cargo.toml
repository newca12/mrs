[package]
name = "mrs-search"
version.workspace = true
edition.workspace = true
description = "Proof search engine with given-clause loop"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ml-guidance = ["mrs-core/ml", "dep:rand", "dep:wincode", "dep:burn", "burn?/ndarray", "burn?/std"]

[dependencies]
mrs-core = { workspace = true }
mrs-calculus = { workspace = true }
mrs-index = { workspace = true }
mrs-proof = { workspace = true }
cadical = { workspace = true }
rustc-hash = { workspace = true }
rand = { version = "0.10", optional = true }
wincode = { version = "0.5.5", optional = true }
burn = { version = "0.21.0", optional = true, default-features = false }
