[package]
name = "mrs-search"
version.workspace = true
edition.workspace = true
description = "Proof search engine with given-clause loop"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ml-guidance = ["mrs-core/ml", "dep:rand", "dep:wincode", "dep:burn", "burn?/ndarray", "burn?/std"]

[dependencies]
mrs-core = { workspace = true }
mrs-cnf = { workspace = true }
mrs-calculus = { workspace = true }
mrs-unify = { workspace = true }
mrs-index = { workspace = true }
mrs-proof = { workspace = true }
mrs-cadical = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }
burn = { workspace = true, optional = true }
