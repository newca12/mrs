[package]
name = "mrs-core"
version.workspace = true
edition.workspace = true
description = "Core logic types for the MRS automated theorem prover: terms, formulas, clauses, and substitutions"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
proover = []
ml = ["dep:burn", "dep:wincode", "burn/ndarray", "burn/std"]

[dependencies]
smallvec = { workspace = true }
rustc-hash = { workspace = true }
sha2 = { workspace = true }
burn = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
