[package]
name = "mrs-core"
version.workspace = true
edition.workspace = true
description = "Core logic types for the MRS automated theorem prover: terms, formulas, clauses, and substitutions"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
proover = []
ml = ["dep:burn", "dep:wincode", "burn/ndarray", "burn/std"]

[dependencies]
smallvec = "1.15.1"
rustc-hash = { workspace = true }
burn = { version = "0.21.0", optional = true, default-features = false }
wincode = { workspace = true, optional = true }
